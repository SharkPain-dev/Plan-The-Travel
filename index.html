<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan The Travel - App</title>
    <style>
        :root {
            --primary-blue: #0077b6;
            --accent-yellow: #ffb703;
            --danger-red: #d00000;
            --success-green: #2d6a4f;
            --bg-color: #e0f2f1;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: var(--white);
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            position: relative;
        }

        h1 { color: var(--primary-blue); margin: 10px 0; font-size: 28px; }
        
        .menu-btn {
            display: block;
            width: 100%;
            padding: 20px;
            margin: 15px 0;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: transform 0.2s;
        }
        .menu-btn:active { transform: scale(0.95); }
        .btn-white { background-color: var(--primary-blue); }
        .btn-battle { background-color: var(--danger-red); }
        .btn-final { background-color: var(--accent-yellow); color: #333; }

        #quiz-screen { display: none; }
        
        .stats-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            margin-bottom: 15px;
            height: 40px;
        }

        .heart { color: var(--danger-red); margin: 0 5px; transition: 0.3s; }
        .counter { 
            background: var(--success-green); 
            color: white; 
            padding: 5px 15px; 
            border-radius: 20px; 
            font-size: 18px; 
            font-weight: bold;
        }

        .question-box {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 20px;
            border: 2px solid #eee;
            min-height: 200px;
        }

        .opt-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
            line-height: 1.4;
        }
        .correct { background: #d8f3dc; color: var(--success-green); }
        .wrong { background: #ffccd5; color: var(--danger-red); }

        .action-btn {
            display: none;
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            background: var(--primary-blue);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .back-btn {
            background: none;
            border: none;
            color: #666;
            text-decoration: underline;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>

<div id="main-menu" class="container">

    let currentType = '';
    let lives = 3;
    let finalScore = 0;
    let currentQuestionObj = null;

    function initQuiz(type) {
        currentType = type;
        lives = 3;
        finalScore = 0;
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        generateQuestion();
    }

    function updateStats() {
        const stats = document.getElementById('stats');
        stats.innerHTML = '';
        if (currentType === 'battle') {
            for (let i = 0; i < 3; i++) {
                stats.innerHTML += `<span class="heart" style="opacity: ${i < lives ? '1' : '0.2'}">❤️</span>`;
            }
        } else if (currentType === 'final') {
            stats.innerHTML = `<span class="counter">Punti: ${finalScore} / 3</span>`;
        }
    }

    function generateQuestion() {
        updateStats();
        document.getElementById('result').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('options-container').style.pointerEvents = 'auto';

        let label = (currentType === 'white') ? "⚪ Domanda Secca" : (currentType === 'battle') ? "⚔️ Battle!" : "🏆 Finale";
        document.getElementById('title-type').innerText = label;

        const filtered = database.filter(q => q.type === currentType);
        
        if (filtered.length === 0) {
            alert("Errore: Nessuna domanda caricata per questa categoria!");
            goHome();
            return;
        }

        currentQuestionObj = filtered[Math.floor(Math.random() * filtered.length)];

        document.getElementById('question-text').innerText = currentQuestionObj.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        currentQuestionObj.a.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(i);
            container.appendChild(btn);
        });
    }

    function checkAnswer(selected) {
        const res = document.getElementById('result');
        const container = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const correctIndex = currentQuestionObj.c;
        
        res.style.display = 'block';
        container.style.pointerEvents = 'none';

        if (selected === correctIndex) {
            res.className = 'feedback correct';
            res.innerHTML = "CORRETTO! ✅<br><small>" + currentQuestionObj.fact + "</small>";
            if (currentType === 'final') finalScore++;
        } else {
            res.className = 'feedback wrong';
            res.innerHTML = "SBAGLIATO! ❌<br><small>La risposta giusta era: <b>" + currentQuestionObj.a[correctIndex] + "</b><br>" + currentQuestionObj.fact + "</small>";
            if (currentType === 'battle') lives--;
        }

        updateStats();

        // Logica pulsante "Prossima"
        if (currentType === 'battle' && lives <= 0) {
            res.innerHTML += "<br><b>GAME OVER! 💀</b>";
            setTimeout(goHome, 2000);
        } else if (currentType === 'final' && selected !== correctIndex) {
            res.innerHTML += "<br><b>HAI PERSO! 🛑</b>";
            setTimeout(goHome, 2000);
        } else if (currentType === 'final' && finalScore >= 3) {
            res.innerHTML = "🏆 <b>VITTORIA FINALE!</b> 🏆";
            setTimeout(goHome, 3000);
        } else {
            nextBtn.style.display = 'block';
        }
    }

    function goHome() {
        document.getElementById('main-menu').style.display = 'block';
        document.getElementById('quiz-screen').style.display = 'none';
    }
</script>
</body>
</html>
