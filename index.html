<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan The Travel - App</title>
    <style>
        :root {
            --primary-blue: #0077b6;
            --accent-yellow: #ffb703;
            --danger-red: #d00000;
            --success-green: #2d6a4f;
            --bg-color: #e0f2f1;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: var(--white);
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            position: relative;
        }

        h1 { color: var(--primary-blue); margin: 10px 0; font-size: 28px; }
        
        .menu-btn {
            display: block;
            width: 100%;
            padding: 20px;
            margin: 15px 0;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: transform 0.2s;
        }
        .menu-btn:active { transform: scale(0.95); }
        .btn-white { background-color: var(--primary-blue); }
        .btn-battle { background-color: var(--danger-red); }
        .btn-final { background-color: var(--accent-yellow); color: #333; }

        #quiz-screen { display: none; }
        
        .stats-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            margin-bottom: 15px;
            height: 40px;
        }

        .heart { color: var(--danger-red); margin: 0 5px; transition: 0.3s; }
        .counter { 
            background: var(--success-green); 
            color: white; 
            padding: 5px 15px; 
            border-radius: 20px; 
            font-size: 18px; 
            font-weight: bold;
        }

        .question-box {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 20px;
            border: 2px solid #eee;
            min-height: 200px;
        }

        .opt-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
            line-height: 1.4;
        }
        .correct { background: #d8f3dc; color: var(--success-green); }
        .wrong { background: #ffccd5; color: var(--danger-red); }

        .action-btn {
            display: none;
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            background: var(--primary-blue);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .back-btn {
            background: none;
            border: none;
            color: #666;
            text-decoration: underline;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="main-menu" class="container">
    <div style="font-size: 60px;">🌍</div>
    <h1>Plan The Travel</h1>
    <p style="color: #666;">Il compagno di viaggio ufficiale</p>
    <button class="menu-btn btn-white" onclick="initQuiz('white')">⚪ DOMANDA SECCA</button>
    <button class="menu-btn btn-battle" onclick="initQuiz('battle')">⚔️ DUELLO BATTLE</button>
    <button class="menu-btn btn-final" onclick="initQuiz('final')">🏆 SFIDA FINALE</button>
</div>

<div id="quiz-screen" class="container">
    <div id="stats" class="stats-bar"></div>
    <h2 id="title-type" style="margin: 0; font-size: 20px; color: var(--primary-blue);"></h2>
    
    <div class="question-box">
        <p id="question-text" style="font-weight: bold; font-size: 18px; margin-bottom: 20px;"></p>
        <div id="options-container"></div>
        <div id="result" class="feedback"></div>
    </div>

    <button id="next-btn" class="action-btn" onclick="generateQuestion()">PROSSIMA DOMANDA →</button>
    <button class="back-btn" onclick="goHome()">Esci e torna al menu</button>
</div>

<script>
    const database = [
        // --- ⚪ DOMANDE SECCHE (Curiosità dal mondo, Cibo, Usanze) ---
        { type: 'white', q: "In quale paese è considerato maleducato finire tutto il cibo nel piatto?", a: ["Cina", "Giappone", "USA", "Italia"], c: 0, fact: "In Cina significa che il padrone di casa non ti ha dato abbastanza cibo!" },
        { type: 'white', q: "Quale città ha più cani che bambini?", a: ["Parigi", "San Francisco", "Tokyo", "Milano"], c: 1, fact: "A San Francisco si contano circa 120.000 cani contro 110.000 bambini." },
        { type: 'white', q: "In quale nazione si mangia il 'Kangaroo Burger' regolarmente?", a: ["Sudafrica", "Australia", "Nuova Zelanda", "Canada"], c: 1, fact: "In Australia la carne di canguro è comune ed ecosostenibile." },
        { type: 'white', q: "In quale paese è nato il gioco degli scacchi?", a: ["Cina", "India", "Russia", "Persia"], c: 1, fact: "Nato nel VI secolo col nome di Chaturanga." },
        { type: 'white', q: "In quale città puoi visitare la 'Casa di Giulietta'?", a: ["Venezia", "Firenze", "Verona", "Siena"], c: 2, fact: "Migliaia di persone lasciano lettere d'amore sotto il famoso balcone." },

        // ... (Aggiungi qui le altre 244 domande bianche seguendo lo schema)

        // --- ⚔️ DUELLO BATTLE (Record, Sport, Geografia veloce) ---
        { type: 'battle', q: "Qual è il monte più alto d'Europa?", a: ["Monte Bianco", "Elbrus", "Cervino", "Etna"], c: 1, fact: "Il monte Elbrus si trova nel Caucaso, in Russia." },
         { type: 'battle', q: "Qual è lo stato più grande del mondo per superficie?", a: ["Canada", "USA", "Russia", "Cina"], c: 2, fact: "La Russia copre oltre 17 milioni di km quadrati!" },
         { type: 'battle', q: "Chi ha dipinto la 'Notte Stellata'?", a: ["Picasso", "Monet", "Van Gogh", "Dalì"], c: 2, fact: "Fu dipinta nel 1889 durante il suo soggiorno in manicomio." },
        // ... (Aggiungi qui le altre 244 domande battle seguendo lo schema)

        // --- 🏆 SFIDA FINALE (Storia, Geografia Difficile, Scienza) ---
        { type: 'final', q: "Qual è la capitale del Kazakistan?", a: ["Astana", "Almaty", "Bishkek", "Tashkent"], c: 0, fact: "Chiamata Nur-Sultan per un breve periodo, è tornata ad essere Astana." },
    // ... (Aggiungi qui le altre 244 domande finali seguendo lo schema)
    ];

    let currentType = '';
    let lives = 3;
    let finalScore = 0;
    let currentQuestionObj = null;

    function initQuiz(type) {
        currentType = type;
        lives = 3;
        finalScore = 0;
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        generateQuestion();
    }

    function updateStats() {
        const stats = document.getElementById('stats');
        stats.innerHTML = '';
        if (currentType === 'battle') {
            for (let i = 0; i < 3; i++) {
                stats.innerHTML += `<span class="heart" style="opacity: ${i < lives ? '1' : '0.2'}">❤️</span>`;
            }
        } else if (currentType === 'final') {
            stats.innerHTML = `<span class="counter">Punti: ${finalScore} / 3</span>`;
        }
    }

    function generateQuestion() {
        updateStats();
        document.getElementById('result').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('options-container').style.pointerEvents = 'auto';

        let label = (currentType === 'white') ? "⚪ Domanda Secca" : (currentType === 'battle') ? "⚔️ Battle!" : "🏆 Finale";
        document.getElementById('title-type').innerText = label;

        const filtered = database.filter(q => q.type === currentType);
        currentQuestionObj = filtered[Math.floor(Math.random() * filtered.length)];

        document.getElementById('question-text').innerText = currentQuestionObj.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        currentQuestionObj.a.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(i);
            container.appendChild(btn);
        });
    }

    function checkAnswer(selected) {
        const res = document.getElementById('result');
        const container = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const correctIndex = currentQuestionObj.c;
        const fact = currentQuestionObj.fact;
        const correctAnswerText = currentQuestionObj.a[correctIndex];
        
        res.style.display = 'block';
        container.style.pointerEvents = 'none';

        if (selected === correctIndex) {
            res.className = 'feedback correct';
            res.innerHTML = "CORRETTO! ✅<br><small>" + fact + "</small>";
            if (currentType === 'final') finalScore++;
        } else {
            res.className = 'feedback wrong';
            res.innerHTML = "SBAGLIATO! ❌<br><small>La risposta giusta era: <b>" + correctAnswerText + "</b><br>" + fact + "</small>";
            if (currentType === 'battle') lives--;
        }

        updateStats();

        // LOGICA DI FINE TURNO / PROSSIMA DOMANDA
        if (currentType === 'battle') {
            if (lives <= 0) {
                res.innerHTML += "<br><b>GAME OVER! 💀</b> Hai perso il duello.";
            } else {
                nextBtn.style.display = 'block';
            }
        } 
        else if (currentType === 'final') {
            if (selected !== correctIndex) {
                res.innerHTML += "<br><b>TURNO FINITO! 🛑</b> Devi riprovare al prossimo giro.";
                // In Sfida Finale, se sbagli, NON appare il tasto Next.
            } else if (finalScore >= 3) {
                res.innerHTML = "🏆 <b>VITTORIA FINALE!</b> 🏆<br>Hai risposto a tutte le domande. HAI VINTO!";
            } else {
                nextBtn.style.display = 'block';
            }
        } 
        else { // Casella Bianca (Domanda Secca)
            nextBtn.style.display = 'block';
        }
    }

    function goHome() {
        document.getElementById('main-menu').style.display = 'block';
        document.getElementById('quiz-screen').style.display = 'none';
    }
</script>

</body>
</html>
